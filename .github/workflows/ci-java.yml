name: Docker image (Java)

on:
  push:
    branches:
      - master
    paths:
      - '**/ci-java.yml'
      - 'java-graalvm.Dockerfile'
      - 'java-bellsoft.Dockerfile'
      - 'java.entrypoint.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    strategy:
      fail-fast: false
      matrix:
        java_version: [11, 17, 21, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Dockerfile path
        id: set_dockerfile
        run: |
          if [ ${{ matrix.java_version }} -lt 21 ]; then
            echo "dockerfile=java-bellsoft.Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=java-graalvm.Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: JAVA_VERSION=${{ matrix.java_version }}
          context: .
          file: ${{ steps.set_dockerfile.outputs.dockerfile }}
          platforms: linux/amd64, linux/arm64
          push: true
          tags: djoh/all-in-one:java${{ matrix.java_version }}
          cache-from: type=registry,ref=djoh/all-in-one:buildcache_java${{ matrix.java_version }}
          cache-to: type=registry,ref=djoh/all-in-one:buildcache_java${{ matrix.java_version }},mode=max
